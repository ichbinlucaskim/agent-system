[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulated-transfer"
version = "0.1.0"
description = "이체 에이전트 실패모드·감사·거절 eval·PII 학습용 연습"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
regulated-transfer = "regulated_transfer.packaging.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../agent-lab"]
testpaths = ["tests"]
