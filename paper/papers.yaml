# papers.yaml is the single source of truth for this library. It is the only
# file a human edits by hand. README.md, README.ko.md, MANIFEST.md, every
# topics/*/README*.md, docs/lineage*.md, and docs/lab-mapping.md are generated
# from this file by scripts/build_index.py and carry a generated marker on
# line 1.
#
# ON THE builds_on, extended_by, AND related FIELDS
#
# These three fields are EDITORIAL groupings chosen for study purposes. They
# record how the papers are arranged for reading in this library. They are NOT
# a claim of formal citation lineage: no citation graph was consulted, no
# bibliography was checked, and an edge here does not assert that one paper
# cites or was influenced by another. Read them as one reader's ordering.
#
# `related` specifically means contemporaneous work with no direction of
# influence asserted in either direction.
#
# ON authors AND year
#
# These two fields are populated from the arXiv API by scripts/add_paper.py
# rather than typed by hand. They are seeded empty and filled on ingestion. If
# you add an entry manually, leave them empty and let the tooling fill them,
# so that the recorded metadata always matches what arXiv actually returned.
#
# Schema per entry, in the order the keys are written:
#   arxiv_id          bare arXiv id, quoted
#   slug              lowercase kebab-case short name
#   title             full paper title
#   authors           list of strings, filled from the arXiv API
#   year              integer, filled from the arXiv API
#   primary_topic     the one topic folder the PDF is stored in
#   also_relevant_to  other topic folders that link to it, may be empty
#   tier              core | deep | reference
#   builds_on         list of arxiv_id strings
#   extended_by       list of arxiv_id strings
#   related           list of arxiv_id strings
#   lab_refs          lab folder names in the sibling lab repository

