[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "answer-engine"
version = "0.1.0"
description = "Worked example: answer engine pipeline (system-design case 02)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
answer-engine = "answer_engine.packaging.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../agent-lab"]
testpaths = ["tests"]
